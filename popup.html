<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, Tahoma, sans-serif; width: 300px; margin: 0; padding: 14px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
  textarea { width: 100%; box-sizing: border-box; direction: ltr; text-align: left; font-size: 13px; height: 58px; }
  .muted { color: #666; font-size: 12px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; }
  button { margin-top: 10px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #status { margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
  <h1>منبه موقع الحساب في اكس</h1>
  <label><input type="checkbox" id="enabled"> تشغيل الإضافة</label>
  <label><input type="checkbox" id="warnVpn"> تحذير عند مؤشر VPN</label>
  <label><input type="checkbox" id="warnRenames"> تحذير عند كثرة تغيير اسم المستخدم</label>
  <label>الحد: <input type="number" id="renameLimit" min="1" max="200" style="width:64px"> مرة فأكثر</label>
  <div class="muted">المناطق التي يظهر عندها تحذير (سطر لكل منطقة كما تكتبها اكس):</div>
  <textarea id="regions"></textarea>
  <div class="row"><span>حسابات تم فحصها</span><b id="checked">0</b></div>
  <div class="row"><span>تحذيرات ظهرت</span><b id="flagged">0</b></div>
  <div id="status" class="muted"></div>
  <button id="save">حفظ</button>
  <button id="clear">مسح الذاكرة المؤقتة</button>
  <script src="popup.js"></script>
</body>
</html>
